action_type: discrete
primitives:
  forward_m: 0.25
  turn_deg: 15.0
rate_hz: 10
sensor_needs: [image]
controls_orientation: false
goal_inputs: [instruction]
signals: [arrived]

depends:
  global_plan: false

config:
  device: auto
  dtype: float16
  execution: units

observations:
  aliases: {}

  datasources:
    robot_pose:
      type: RobotPoseTFGenerator
      params: {}

    rgb:
      type: sensor_msgs/Image
      params:
        sensor: image
        output_size: [512, 512]
